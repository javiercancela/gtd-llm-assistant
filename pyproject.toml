[project]
name = "gtd-llm-assistant"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.195.0",
    "google-auth>=2.50.0",
    "google-auth-oauthlib>=1.3.1",
    "google-genai>=1.75.0",
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
main = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Top-level modules that live directly under src/.
py-modules = ["main", "inbox_json", "inbox_log", "icloud_download"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adapters*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
