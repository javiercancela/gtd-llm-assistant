[project]
name = "gtd-llm-assistant"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.195.0",
    "google-auth>=2.50.0",
    "google-auth-oauthlib>=1.3.1",
    "google-genai>=1.75.0",
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
    "sentence-transformers>=5.1.0",
    "sqlite-vec>=0.1.6",
    "torch>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
main = "gtd_assistant.delivery.cli:main"
gtd-references-query = "gtd_assistant.delivery.reference_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gtd_assistant*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
